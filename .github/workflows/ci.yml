name: Verify Proofline
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: proofline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Application and browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROOFLINE_DB_PATH: .local/ci.sqlite3
      PROOFLINE_OLLAMA_MODEL: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install locked tooling and dependencies
        run: |
          python -m pip install uv==0.11.20
          uv sync --project backend --frozen
          npm ci --ignore-scripts
          npm ci --prefix frontend --ignore-scripts
          npx --no-install playwright install --with-deps chromium
      - name: Verify application and browser behavior
        run: bash scripts/check.sh
      - name: Build portable local delivery bundle
        run: python scripts/package.py
      - name: Verify packaged demo boots
        run: python scripts/check_bundle.py
